# Alembic configuration for ResolveIQ.
#
# The database URL is deliberately NOT stored here. It lives in the environment
# (`.env`, loaded by app.config.Settings) so that the same configuration file
# works for the Docker Compose service, a local PostgreSQL and CI. See
# migrations/env.py.
#
#   alembic upgrade head          apply everything
#   alembic downgrade base        remove everything (test database only)
#   alembic revision -m "..."     autogenerate from the models
#   alembic upgrade head --sql    print the SQL without connecting

[alembic]
script_location = migrations
prepend_sys_path = .

# Left empty on purpose. migrations/env.py reads Settings.database_url instead,
# and falls back to it whenever this is blank.
sqlalchemy.url =

[post_write_hooks]
# No auto-formatting hook is configured. Running `ruff format` over generated
# migrations would silently rewrite code that a reviewer is supposed to read
# before it is committed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
