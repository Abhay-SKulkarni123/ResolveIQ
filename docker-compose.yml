# ResolveIQ — local development stack.
#
#   docker compose up --build
#
# Services:
#   db    PostgreSQL 16 (dev credentials only — see .env.example)
#          MySQL 8 is also supported; see README §Known limitations.
#   api   FastAPI backend, hot-reloading, migrations applied on start
#   web       Vite dev server for the React frontend (hot reload)
#   web-prod  nginx serving the built bundle (closer to production)
#
# SECURITY: only the `api` service receives LLM_* and POSTGRES_* variables.
# The `web` service receives no secrets, and no VITE_* secret may ever be added
# (Vite inlines VITE_* into the browser bundle — see NEP-09).

name: resolveiq

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolveiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-resolveiq}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this, so `docker compose up` works from a cold start.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolveiq} -d ${POSTGRES_DB:-resolveiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-resolveiq}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-resolveiq}
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Keep the image's site-packages; only mount source for hot reload.
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    # NOTE: `alembic upgrade head` is deliberately NOT run on start.
    # Two migrations now exist and the backend image copies alembic.ini and
    # migrations/, but this Compose path has never been executed (no Docker daemon
    # was available in the environment where it was written). Rather than ship an
    # unverified start command, migrations are run explicitly and separately:
    #   docker compose run --rm api alembic upgrade head
    #   docker compose up -d db api web
    # Wire the migration into the start command once the container path has been
    # observed to work, and prefer running it as its own release step.
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # `npm run dev` with hot reload, for day-to-day frontend work. Use the
  # `web-prod` service below when you want the built bundle served by nginx.
  web:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    # node_modules is a named volume so the container's Linux binaries are not
    # shadowed by the host's Windows ones.
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # Production-style frontend: the built bundle served by nginx, which also
  # forwards /api to the api service (see frontend/nginx.conf). The app itself
  # needs no API host setting: src/api/client.ts requests a relative /api/v1.
  web-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
