# ResolveIQ reviewer workbench — production static server.
#
# The API client in src/api/client.ts requests a *relative* `/api/v1`, exactly as it
# does in development. That is deliberate: keeping the path relative means the
# browser never needs to be told where the API lives, and no host is baked into the
# bundle. The consequence is that whatever serves the bundle must also forward
# /api to the backend, which is what this file does. Vite's dev server does the same
# thing via its `proxy` option, so development and production route identically.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend. The name `api` is the docker-compose service
    # name; outside Compose, point this at wherever the backend is reachable.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed asset filenames, so these are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers holding a stale
    # document that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths return the app shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}